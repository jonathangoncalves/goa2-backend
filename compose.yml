services:
  api:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${GOA2_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data/games:/app/data/games
      - ./data/replays:/app/data/replays
      - ./data/shares:/app/data/shares
      - ./data/bug_reports:/app/data/bug_reports
      - ./logs:/app/logs
    restart: unless-stopped
